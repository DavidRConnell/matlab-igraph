name: Build

on:
  - workflow_call

jobs:
  build-toolboxes:
    name: Build toolbox
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc-13
            cxx: g++-13
            pkg_ext: tar.gz
            name: Linux
          - os: macos-latest
            llvm_version: "14.0.5"
            pkg_ext: tar.gz
            name: macOS-arm
          - os: macos-15-intel
            llvm_version: "14.0.5"
            pkg_ext: tar.gz
            name: macOS-intel
          - os: windows-latest
            vcpkg_arch: x64
            cmake_arch: x64
            pkg_ext: zip
            name: Windows

    runs-on: ${{ matrix.os }}
    steps:
      - name: Set environment variables
        shell: bash
        run: |
          if [[ ${{ runner.os }} == 'Linux' ]]; then
            echo "CC=${{ matrix.cc }}" >> $GITHUB_ENV
            echo "CXX=${{ matrix.cxx }}" >> $GITHUB_ENV
          elif [[ ${{ runner.os }} == 'macOS' ]]; then
            echo "LLVM_VERSION=${{ matrix.llvm_version }}" >> $GITHUB_ENV
          else
            echo "IGRAPH_CMAKE_EXTRA_ARGS=-DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_arch }}-windows-static-md -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -A ${{ matrix.cmake_arch }}" >> $GITHUB_ENV
            echo "IGRAPH_EXTRA_LIBRARY_PATH=C:/vcpkg/installed/${{ matrix.vcpkg_arch }}-windows-static-md/lib/" >> $GITHUB_ENV
            echo "IGRAPH_STATIC_EXTENSION=1" >> $GITHUB_ENV
            echo "IGRAPH_EXTRA_LIBRARIES=libxml2,lzma,zlib,iconv,charset,bcrypt" >> $GITHUB_ENV
            echo "IGRAPH_EXTRA_DYNAMIC_LIBRARIES=wsock32,ws2_32" >> $GITHUB_ENV
          fi

      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update && sudo apt upgrade
          sudo apt install cmake ninja-build gcc-13 g++-13 libxml2-dev libbison-dev libfl-dev

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install winflexbison3
          vcpkg integrate install
          vcpkg install libxml2:${{ matrix.vcpkg_arch }}-windows-static-md

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2

      - name: Build toolbox
        shell: bash
        run: |
          cmake -B build . --install-prefix ${GITHUB_WORKSPACE}/dist \
            -DCMAKE_PACKAGE_VERSION="${{ github.ref_name }}" \
            ${IGRAPH_CMAKE_EXTRA_ARGS}
          cmake --build build --config Release
          cmake --install build --config Release

      - name: Package dist
        shell: bash
        run: cmake --build build --target package

      - name: Package source
        if: runner.os == 'Linux'
        run: cmake --build build --target package_source

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: matlab-igraph-${{ matrix.name }}-${{ github.sha }}
          path: build/matlab-igraph_*.${{ matrix.pkg_ext }}

  aggregate-toolboxes:
    name: Combine OS specific files into a single toolbox
    runs-on: ubuntu-latest
    needs: [build-toolboxes]

    steps:
      - uses: actions/checkout@v4

      - name: Collect OS specific toolboxes
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract files
        run: |
          mkdir release
          mv artifacts/matlab-igraph-Linux-${{ github.sha }}/*_source.tar.gz release
          cd artifacts
          tar xf matlab-igraph-Linux-${{ github.sha }}/* --directory matlab-igraph-Linux-${{ github.sha }}
          tar xf matlab-igraph-macOS-arm-${{ github.sha }}/* --directory matlab-igraph-macOS-arm-${{ github.sha }}
          tar xf matlab-igraph-macOS-intel-${{ github.sha }}/* --directory matlab-igraph-macOS-intel-${{ github.sha }}
          unzip matlab-igraph-Windows-${{ github.sha }}/* -d matlab-igraph-Windows-${{ github.sha }}
          cd ..

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2

      - name: Make toolboxes
        uses: matlab-actions/run-command@v2
        with:
          command: addpath(".github/workflows"), buildAllToolboxes("artifacts", "release", "${{ github.ref_name }}")

      - name: Upload toolboxes
        uses: actions/upload-artifact@v4
        with:
          name: matlab-igraph-toolbox-${{ github.sha }}
          path: release/*
